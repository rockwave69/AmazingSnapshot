; AmazingSnapshot — settings
; Place this file in the same folder as sapp_amazing_screenshot.asi.
; Restart the game after changing values.
;
; Boolean options: 1/0, true/false, yes/no, or on/off.

[General]
; Pause world simulation while the screenshot camera is active.
FreezeTime=1

; Hide the complete native HUD, not just the radar.
HideHUD=1

; Freeze already-created FX particles and corona updates on mode entry.
; F2 can toggle this while the mode is active.
FreezeEffectsOnStart=1

; Open the compact controls panel when entering screenshot mode. F1 toggles it.
ShowHelpOnStart=1

[Interface]
; Controls text size. Valid range: 0.18 through 0.75; default: 0.45.
; Larger value increases both the font scale and spacing between lines.
; If a value is outside the range it is clamped to the nearest limit.
FontSize=0.45

[Camera]
; Lowest and highest allowed field of view.
MinimumFOV=10.0
MaximumFOV=150.0

; FOV change per game-process update while [ or ] is held (original-style smooth zoom).
; Default 0.50 degrees per update; range 0.05–5.00. Legacy ZoomSpeed is accepted if ZoomStep is absent.
ZoomStep=0.50

; Mouse rotation sensitivity. Valid range is 0.0001 through 0.02.
MouseSensitivity=0.0026

; Camera movement speed in world units per second.
MoveSpeed=7.0
FastMoveMultiplier=3.0
SlowMoveMultiplier=0.22

[Environment]
; Draw-distance controls (< / >) are temporarily disabled while investigating a rendering issue.
; Hours changed by each main keyboard -/+ press (numpad +/- also works).
HoursPerPress=1

[Keys]
; ModeToggle requires holding ALT as a modifier (default Alt+V).
; Key names: letters/digits, F1-F24, SPACE, TAB, ESC, SHIFT, CTRL, ALT,
; PAGEUP, PAGEDOWN, arrows UP/DOWN/LEFT/RIGHT, OEM_4 ([), OEM_6 (]),
; OEM_102 (ISO <> key), OEM_MINUS, OEM_PLUS, OEM_COMMA, OEM_PERIOD,
; NUM_PLUS, NUM_MINUS, ENTER, BACKSPACE. Weather presets work on the number row and numpad.
ModeToggle=V
Widescreen=TAB
ZoomIn=OEM_4
ZoomOut=OEM_6
ResetZoom=P
ToggleHelp=F1
ToggleEffectFreeze=F2
TakePhoto=F12
Ascend=SPACE
Descend=C
MoveForward=W
MoveBackward=S
MoveLeft=A
MoveRight=D
MoveFast=SHIFT
MoveSlow=CTRL
TimeHourDecrease=OEM_MINUS
TimeHourIncrease=OEM_PLUS
