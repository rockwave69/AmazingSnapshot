; AmazingSnapshot — settings
; Place this file in the same folder as AmazingSnapshot.asi in each supported game.
; Restart the game after changing values.
;
; Boolean options: 1/0, true/false, yes/no, or on/off.

[General]
; Start screenshot mode with the game world paused. ToggleTimePlayback switches between PAUSED and PLAYING while the mode is active.
FreezeTime=1

; Hide the complete native HUD, not just the radar.
HideHUD=1

; San Andreas only: freeze already-created FX particles and corona updates.
; GTA III and Vice City do not implement this effect-freeze path.
FreezeEffectsOnStart=1

; Open the compact controls panel when entering screenshot mode. F1 toggles it.
ShowHelpOnStart=1

[Interface]
; Controls text size. Valid range: 0.18 through 0.75; default: 0.45.
; Larger value increases both the font scale and spacing between lines.
; If a value is outside the range it is clamped to the nearest limit.
FontSize=0.45

[Camera]
; Lowest and highest allowed field of view.
MinimumFOV=10.0
MaximumFOV=150.0

; FOV change speed while zoom is held. Range: 1–300.
; GTA III and Vice City preserve the legacy per-render-update step (ZoomSpeed / 60 degrees).
; San Andreas uses degrees per second and caps long frame gaps to avoid jumps.
; If ZoomSpeed is absent, legacy ZoomStep is converted using a 60 Hz reference.
ZoomSpeed=30.0

; Mouse rotation sensitivity. Valid range is 0.0001 through 0.02.
MouseSensitivity=0.0026

; Camera movement speed in world units per second.
MoveSpeed=7.0
FastMoveMultiplier=3.0
SlowMoveMultiplier=0.22

[Environment]
; Draw-distance controls (< / >) are temporarily disabled while investigating a rendering issue.
; Hours changed by each main keyboard -/+ press (numpad +/- also works).
HoursPerPress=1

[Keys]
; Bindings use PHYSICAL KEY SCAN CODES, not characters or virtual-key symbols.
; SC_0xNN is a hexadecimal Set-1 scan code. It identifies the key position, so
; Shift changes the produced character but not the binding (the '=' / '+' key
; is always SC_0x0D, and the minus / underscore key is always SC_0x0C).
; SC_0x200 = either Shift, SC_0x201 = either Ctrl, SC_0x202 = either Alt.
; In-game help uses fixed US physical-key labels (W/A/S/D, [, ], etc.) and
; does not change its wording when the active keyboard layout changes.
; Alt+V toggles screenshot mode. While mode is on, V switches FREE/FOLLOW, F3 toggles game time PAUSED/PLAYING, and Esc opens/closes the game menu. Alt+V is the only mode exit.
; While screenshot mode is active, gameplay/replay hotkeys are suppressed; menu navigation keys are passed after Esc opens the menu.
; Standard PC physical codes used by the defaults:
; Esc=SC_0x01, Tab=SC_0x0F, Space=SC_0x39, W=SC_0x11, A=SC_0x1E,
; S=SC_0x1F, D=SC_0x20, C=SC_0x2E, V=SC_0x2F, P=SC_0x19,
; [ and ] remain alternate FOV controls; Numpad *=zoom in and Numpad /=zoom out in all three games.
; Numpad +/- change the game hour only (along with main keyboard -/=); they never control FOV.
; F1 toggles help, F3 toggles time playback, and F12 captures a photo in all three games.
; F2 effect-freeze controls are San Andreas-only.
; Number-row and numpad weather keys use physical scan codes in the adapters.
ModeToggle=SC_0x2F
ToggleTimePlayback=SC_0x3D
Widescreen=SC_0x0F
ZoomIn=SC_0x1A
ZoomOut=SC_0x1B
ResetZoom=SC_0x19
ToggleHelp=SC_0x3B
ToggleEffectFreeze=SC_0x3C
TakePhoto=SC_0x58
Ascend=SC_0x39
Descend=SC_0x2E
MoveForward=SC_0x11
MoveBackward=SC_0x1F
MoveLeft=SC_0x1E
MoveRight=SC_0x20
MoveFast=SC_0x200
MoveSlow=SC_0x201
TimeHourDecrease=SC_0x0C
TimeHourIncrease=SC_0x0D
